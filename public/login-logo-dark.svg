      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="loginLogoDarkAmber" x1="120" y1="120" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
