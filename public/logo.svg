<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <!-- Horizontal Nav Logo - Dark Text / Transparent for Light Backgrounds (#EF5B25) -->
  <g transform="translate(48, 60)">
    <!-- Deep Navy Shield Outline -->
    <path d="M0 -34 L28 -20 C28 10 0 32 0 35 C0 32 -28 10 -28 -20 Z" 
          fill="none" 
          stroke="#0A182F" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Subtle Inset Shield -->
    <path d="M0 -26 L20 -16 C20 6 0 24 0 26 C0 24 -20 6 -20 -16 Z" 
          fill="none" 
          stroke="#0A182F" 
          stroke-opacity="0.15" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Pulse Wave in #EF5B25 -->
    <path d="M-38 0 L-19 0 L-11 -18 L-3 20 L5 -12 L13 8 L21 0 L38 0" 
          fill="none" 
          stroke="#EF5B25" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark 'BidPulse' with 'Bid' in Deep Navy (#0A182F) and 'Pulse' in #EF5B25 -->
  <text x="110" y="74" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="-0.5">
    <tspan fill="#0A182F">Bid</tspan><tspan fill="#EF5B25">Pulse</tspan>
  </text>
</svg>