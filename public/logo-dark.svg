<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <!-- Horizontal Nav Logo - Light Text / Transparent for Dark Backgrounds (#EF5B25) -->
  <g transform="translate(48, 60)">
    <!-- Crisp White Shield Outline -->
    <path d="M0 -34 L28 -20 C28 10 0 32 0 35 C0 32 -28 10 -28 -20 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Subtle Inset Shield -->
    <path d="M0 -26 L20 -16 C20 6 0 24 0 26 C0 24 -20 6 -20 -16 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.3" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Pulse Wave in #EF5B25 — horizontally rescaled to 90% of the
         shield's half-width (28 to 25.2), keeping y untouched. This
         variant's own pulse path was narrower than the app icon's to
         begin with (x=+-38, not +-40), but the shield here is the same
         28-half-width one — still overflowed by 10 units each side, not
         "already fine" as originally assumed. -->
    <path d="M-25.2 0 L-12.6 0 L-7.3 -18 L-2 20 L3.3 -12 L8.6 8 L13.9 0 L25.2 0"
          fill="none" 
          stroke="#EF5B25" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark 'BidPulse' with 'Bid' in Pure White (#FFFFFF) and 'Pulse' in #EF5B25 -->
  <text x="110" y="74" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Bid</tspan><tspan fill="#EF5B25">Pulse</tspan>
  </text>
</svg>