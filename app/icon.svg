<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- BidPulse Favicon / App Icon Master (512x512 px) in Deep Navy and #EF5B25 -->
  <rect width="512" height="512" rx="112" fill="#0A182F"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#1E293B" stroke-width="4"/>

  <!-- Centered Shield & Pulse in #EF5B25 -->
  <g transform="translate(256, 256) scale(4.2)">
    <!-- White Shield Outline -->
    <path d="M0 -34 L28 -20 C28 10 0 32 0 35 C0 32 -28 10 -28 -20 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Subtle Inset Shield -->
    <path d="M0 -26 L20 -16 C20 6 0 24 0 26 C0 24 -20 6 -20 -16 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.25" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Pulse Wave in #EF5B25 -->
    <path d="M-40 0 L-20 0 L-12 -18 L-4 20 L4 -12 L12 8 L20 0 L40 0" 
          fill="none" 
          stroke="#EF5B25" 
          stroke-width="4.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>